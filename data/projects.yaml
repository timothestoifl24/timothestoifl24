# Project list for https://timothestoifl24.dev
#
# One entry per project. The build fails if a required field is missing,
# a status is unknown, a slug is duplicated, or a preview file is missing.
#
# Fields
#   slug       required  kebab-case, unique; also the preview file name
#   name       required
#   one_line   required  one sentence, ~120 chars max
#   category   required  shown as a small label on the card
#   status     required  active | maintained | paused | archived
#   featured   optional  true sorts the project to the top of "My Projects" (default false)
#   stack      required  list of short tags
#   repo       required  repository URL
#   site       optional  project site / demo; the preview image links here (falls back to repo)
#   preview    optional  path under site/public/, default previews/<slug>.svg (copy the repo's social-preview.svg there);
#                        without one the card shows a plain name panel
#   created    required  date the project started, YYYY-MM-DD (shown as "Created: 13 August 2026")

