stages:
  - sync
  - publish

variables:
  GIT_DEPTH: 0

pages:
  stage: publish
  image: alpine:latest

  script:
    - mkdir public
    - cp -r index.html assets public/

  artifacts:
    paths:
      - public

  rules:
    - if: $CI_COMMIT_BRANCH == "main"

sync_to_github:
  stage: sync
  image: alpine:latest

  before_script:
    - apk add --no-cache git

  script:
    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@gitlab.local"
    - git remote remove github || true
    - git remote add github https://oauth2:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}
    - git fetch --all
    - git log --oneline -n 5
    - git push github HEAD:main --force-with-lease

  rules:
    - if: $CI_COMMIT_BRANCH == "main"